<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Minesweeper</title>
    
</head>
<body>
    <header>
        <h1 class="game-title">Minesweeper</h1>
        <div class="header-actions">
            <a href="https://minesweeper.online/help/gameplay" 
                class="btn-rules" 
                target="_blank" 
                rel="noopener noreferrer" 
                aria-label="Правила гри">🗐
            </a>
        </div>
    </header>
    <main>
        <div class="game-container">
            <header class="status-bar">
                <div class="mines-counter status-badge">
                    <span class="counter-icon" aria-hidden="true">⚑</span>
                    <output class="counter-value" role="status" aria-live="polite" aria-label="Залишилось прапорців">000</output>
                </div>

                <button type="button" class="btn-restart" aria-label="Нова гра">❀</button>

                <div class="timer status-badge">
                    <span class="timer-icon" aria-hidden="true">⏱</span>
                    <!-- aria-live="off": інакше таймер озвучувався б щосекунди -->
                    <output class="timer-value" aria-live="off" aria-label="Таймер">000</output>
                </div>
            </header>
            <p class="game-message" role="status" aria-live="polite"></p>
            <section class="game-field" aria-label="Ігрове поле"></section>
            <p class="game-hint">ЛКМ — відкрити, ПКМ або клавіша F — прапорець</p>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
