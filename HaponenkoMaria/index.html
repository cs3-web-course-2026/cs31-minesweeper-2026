<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <title>My minesweeper</title>
  </head>
  <body>
    <main id="minesweeper">
      <p id="game-message" role="status" aria-live="polite"></p>
      <header id="game-info">
        <div id="mines-count" aria-label="Mines remaining">
          <span>10</span>
        </div>

        <button type="button" id="start-button" aria-label="Start Game">
          <img id="btn-img" src="pictures/START.png" alt="" />
        </button>

        <div id="timer" aria-label="Time elapsed">
          <span>0</span>
        </div>
      </header>
      <div id="game-board"></div>
    </main>
  </body>
</html>
