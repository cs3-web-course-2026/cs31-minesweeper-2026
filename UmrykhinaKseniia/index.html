<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <h1>Minesweeper</h1>
    <section class="panel">
      <div class="counter" title="Доступні прапорці">🚩 <span id="flags-counter">0</span></div>
      <button id="restart-btn" type="button">Старт / Рестарт</button>
      <div class="counter" title="Час гри">⏱ <span id="timer">0</span> c</div>
    </section>
    <div id="board" class="board"></div>
    <p id="message" class="message" aria-live="polite"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
