<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game">
        <div class="game-header">
            <div class="counter">
                🚩 <span id="flags">010</span>
            </div>

            <button class="restart-btn">🙂</button>

            <div class="timer">
                ⏱ <span id="time">000</span>
            </div>
        </div>

        <div class="board">
            <div class="cell closed"></div>
            <div class="cell closed"></div>
            <div class="cell opened num1">1</div>
            <div class="cell opened"></div>
            <div class="cell flagged"></div>

            <div class="cell closed"></div>
            <div class="cell opened num2">2</div>
            <div class="cell opened num3">3</div>
            <div class="cell mine"></div>
            <div class="cell mine boom"></div>

            <div class="cell closed"></div>
            <div class="cell opened"></div>
            <div class="cell closed"></div>
            <div class="cell opened num1">1</div>
            <div class="cell closed"></div>

            <div class="cell flagged"></div>
            <div class="cell closed"></div>
            <div class="cell opened"></div>
            <div class="cell closed"></div>
            <div class="cell closed"></div>

            <div class="cell opened num2">2</div>
            <div class="cell closed"></div>
            <div class="cell opened"></div>
            <div class="cell closed"></div>
            <div class="cell opened num1">1</div>
        </div>
    </div>
</body>
</html>
