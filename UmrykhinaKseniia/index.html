<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <h1>Minesweeper</h1>

    <header class="panel">
      <div
        class="counter"
        title="Доступні прапорці"
        role="status"
        aria-live="polite"
      >
        🚩 <span id="flags-counter">0</span>
      </div>

      <button id="restart-btn" type="button">Старт / Рестарт</button>

      <div class="counter" title="Час гри">
        ⏱ <span id="timer">0</span> c
      </div>
    </header>

    <div id="board" class="board"></div>

    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
