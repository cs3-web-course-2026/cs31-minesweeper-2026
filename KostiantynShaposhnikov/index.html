<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гра "Сапер"</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <!-- Хедер гри -->
        <header class="game-header">
            <div class="counter-display" id="flag-count" role="status" aria-live="polite" aria-label="Залишилося прапорців">010</div>
            <button class="restart-btn" id="restart-btn" type="button" title="Нова гра" aria-label="Почати нову гру">▶️</button>
            <div class="counter-display" id="timer" role="timer" aria-live="off" aria-label="Час гри у секундах">000</div>
        </header>

        <div id="game-status" role="status" aria-live="polite" class="game-status"></div>

        <!-- Ігрове поле -->
        <main class="board" id="board" aria-label="Ігрове поле Сапер"></main>
    </div>

    <script src="script.js"></script>
</body>
</html>
