<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper: Minions Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
    <main class="game">
        <header class="game-header">
            <div class="counter" aria-label="Кількість прапорців" role="status" aria-live="polite">015</div>
            
            <button type="button" class="btn-start" aria-label="Почати нову гру">
                <img src="user-image.jpg" alt="Аватар користувача" class="btn-start-img">
            </button>
            
            <div class="counter" aria-label="Таймер">000</div>
        </header>

        <section class="game-board"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
