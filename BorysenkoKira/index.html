<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper: Minions Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="tnkb-page">
    <main class="tnkb-game">

        <header class="tnkb-game__header">
            <div class="tnkb-counter" aria-label="Кількість прапорців">010</div>
            
            <button class="tnkb-btn-start" aria-label="Почати нову гру">
                <img src="user-image.jpg" alt="Аватар користувача" class="tnkb-btn-start__img">
            </button>
            
            <div class="tnkb-counter" aria-label="Таймер">000</div>
        </header>

        <section class="tnkb-game__board">
            <button class="tnkb-cell"></button>
            <button class="tnkb-cell"></button>
            <button class="tnkb-cell tnkb-cell--flag">
                <img class="tnkb-icon" src="custom-flag.png" alt="Прапорець">
            </button>
            <button class="tnkb-cell"></button>
            <button class="tnkb-cell"></button>
            <button class="tnkb-cell tnkb-cell--flag">
                <img class="tnkb-icon" src="custom-flag.png" alt="Прапорець">
            </button>
            <button class="tnkb-cell"></button>
            <button class="tnkb-cell"></button>

            <button class="tnkb-cell tnkb-cell--open"></button>
            <button class="tnkb-cell tnkb-cell--open" data-num="1">1</button>
            <button class="tnkb-cell tnkb-cell--open" data-num="2">2</button>
            <button class="tnkb-cell tnkb-cell--open" data-num="1">1</button>
            <button class="tnkb-cell tnkb-cell--open"></button>
            <button class="tnkb-cell tnkb-cell--open"></button>
            <button class="tnkb-cell tnkb-cell--open"></button>
            <button class="tnkb-cell tnkb-cell--open"></button>

            <button class="tnkb-cell tnkb-cell--open"></button>
            <button class="tnkb-cell tnkb-cell--open" data-num="1">1</button>
            <button class="tnkb-cell tnkb-cell--open tnkb-cell--mine">
                <img class="tnkb-icon" src="evil-minion.png" alt="Злий міньйон">
            </button>
            <button class="tnkb-cell tnkb-cell--open" data-num="2">2</button>
            <button class="tnkb-cell tnkb-cell--open" data-num="1">1</button>
            <button class="tnkb-cell tnkb-cell--open" data-num="3">3</button>
            <button class="tnkb-cell tnkb-cell--flag tnkb-cell--false-flag">
                <img class="tnkb-icon" src="custom-flag.png" alt="Прапорець">
            </button>
            <button class="tnkb-cell"></button>

            <button class="tnkb-cell tnkb-cell--open"></button>
            <button class="tnkb-cell tnkb-cell--open"></button>
            <button class="tnkb-cell tnkb-cell--open" data-num="1">1</button>
            <button class="tnkb-cell tnkb-cell--open tnkb-cell--exploded">
                <img class="tnkb-icon" src="evil-minion.png" alt="Злий міньйон">
            </button>
            <button class="tnkb-cell tnkb-cell--open" data-num="2">2</button>
            <button class="tnkb-cell tnkb-cell--open tnkb-cell--mine">
                <img class="tnkb-icon" src="evil-minion.png" alt="Злий міньйон">
            </button>
            <button class="tnkb-cell tnkb-cell--open" data-num="2">2</button>
            <button class="tnkb-cell"></button>
            
            <button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button>
            <button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button>
            <button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button>
            <button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button><button class="tnkb-cell"></button>
        </section>
    </main>
</body>
</html>
