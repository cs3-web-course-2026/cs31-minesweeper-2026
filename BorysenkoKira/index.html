<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper: Minions Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="tnkb-page">
    <main class="tnkb-game">

        <header class="tnkb-game-header">
            <div class="tnkb-counter" aria-label="Кількість прапорців" role="status" aria-live="polite">010</div>
            
            <button type="button" class="tnkb-btn-start" aria-label="Почати нову гру">
                <img src="user-image.jpg" alt="Аватар користувача" class="tnkb-btn-start-img">
            </button>
            
            <div class="tnkb-counter" aria-label="Таймер">000</div>
        </header>

        <section class="tnkb-game-board">
            <button type="button" class="tnkb-cell" aria-label="Рядок 1, стовпець 1, закрито"></button>
            <button type="button" class="tnkb-cell" aria-label="Рядок 1, стовпець 2, закрито"></button>
            <button type="button" class="tnkb-cell tnkb-cell-flag" aria-label="Рядок 1, стовпець 3, встановлено прапорець">
                <img class="tnkb-icon" src="custom-flag.png" alt="Прапорець">
            </button>
            <button type="button" class="tnkb-cell" aria-label="Рядок 1, стовпець 4, закрито"></button>
            <button type="button" class="tnkb-cell" aria-label="Рядок 1, стовпець 5, закрито"></button>
            <button type="button" class="tnkb-cell tnkb-cell-flag" aria-label="Рядок 1, стовпець 6, встановлено прапорець">
                <img class="tnkb-icon" src="custom-flag.png" alt="Прапорець">
            </button>
            <button type="button" class="tnkb-cell" aria-label="Рядок 1, стовпець 7, закрито"></button>
            <button type="button" class="tnkb-cell" aria-label="Рядок 1, стовпець 8, закрито"></button>

            <button type="button" class="tnkb-cell tnkb-cell-open" aria-label="Рядок 2, стовпець 1, відкрито, порожньо"></button>
            <button type="button" class="tnkb-cell tnkb-cell-open" data-num="1" aria-label="Рядок 2, стовпець 2, відкрито, цифра 1">1</button>
            <button type="button" class="tnkb-cell tnkb-cell-open" data-num="2" aria-label="Рядок 2, стовпець 3, відкрито, цифра 2">2</button>
            <button type="button" class="tnkb-cell tnkb-cell-open" data-num="1" aria-label="Рядок 2, стовпець 4, відкрито, цифра 1">1</button>
            <button type="button" class="tnkb-cell tnkb-cell-open" aria-label="Рядок 2, стовпець 5, відкрито, порожньо"></button>
            <button type="button" class="tnkb-cell tnkb-cell-open" aria-label="Рядок 2, стовпець 6, відкрито, порожньо"></button>
            <button type="button" class="tnkb-cell tnkb-cell-open" aria-label="Рядок 2, стовпець 7, відкрито, порожньо"></button>
            <button type="button" class="tnkb-cell tnkb-cell-open" aria-label="Рядок 2, стовпець 8, відкрито, порожньо"></button>

            <button type="button" class="tnkb-cell tnkb-cell-open" aria-label="Рядок 3, стовпець 1, відкрито, порожньо"></button>
            <button type="button" class="tnkb-cell tnkb-cell-open" data-num="1" aria-label="Рядок 3, стовпець 2, відкрито, цифра 1">1</button>
            <button type="button" class="tnkb-cell tnkb-cell-open tnkb-cell-mine" aria-label="Рядок 3, стовпець 3, відкрито, міна">
                <img class="tnkb-icon" src="evil-minion.png" alt="Злий міньйон">
            </button>
            <button type="button" class="tnkb-cell tnkb-cell-open" data-num="2" aria-label="Рядок 3, стовпець 4, відкрито, цифра 2">2</button>
            <button type="button" class="tnkb-cell tnkb-cell-open" data-num="1" aria-label="Рядок 3, стовпець 5, відкрито, цифра 1">1</button>
            <button type="button" class="tnkb-cell tnkb-cell-open" data-num="3" aria-label="Рядок 3, стовпець 6, відкрито, цифра 3">3</button>
            <button type="button" class="tnkb-cell tnkb-cell-flag tnkb-cell-false-flag" aria-label="Рядок 3, стовпець 7, хибний прапорець">
                <img class="tnkb-icon" src="custom-flag.png" alt="Прапорець">
            </button>
            <button type="button" class="tnkb-cell" aria-label="Рядок 3, стовпець 8, закрито"></button>

            <button type="button" class="tnkb-cell tnkb-cell-open" aria-label="Рядок 4, стовпець 1, відкрито, порожньо"></button>
            <button type="button" class="tnkb-cell tnkb-cell-open" aria-label="Рядок 4, стовпець 2, відкрито, порожньо"></button>
            <button type="button" class="tnkb-cell tnkb-cell-open" data-num="1" aria-label="Рядок 4, стовпець 3, відкрито, цифра 1">1</button>
            <button type="button" class="tnkb-cell tnkb-cell-open tnkb-cell-exploded" aria-label="Рядок 4, стовпець 4, вибух міни">
                <img class="tnkb-icon" src="evil-minion.png" alt="Злий міньйон">
            </button>
            <button type="button" class="tnkb-cell tnkb-cell-open" data-num="2" aria-label="Рядок 4, стовпець 5, відкрито, цифра 2">2</button>
            <button type="button" class="tnkb-cell tnkb-cell-open tnkb-cell-mine" aria-label="Рядок 4, стовпець 6, відкрито, міна">
                <img class="tnkb-icon" src="evil-minion.png" alt="Злий міньйон">
            </button>
            <button type="button" class="tnkb-cell tnkb-cell-open" data-num="2" aria-label="Рядок 4, стовпець 7, відкрито, цифра 2">2</button>
            <button type="button" class="tnkb-cell" aria-label="Рядок 4, стовпець 8, закрито"></button>
            
            <button type="button" class="tnkb-cell" aria-label="Рядок 5, стовпець 1, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 5, стовпець 2, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 5, стовпець 3, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 5, стовпець 4, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 5, стовпець 5, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 5, стовпець 6, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 5, стовпець 7, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 5, стовпець 8, закрито"></button>
            
            <button type="button" class="tnkb-cell" aria-label="Рядок 6, стовпець 1, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 6, стовпець 2, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 6, стовпець 3, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 6, стовпець 4, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 6, стовпець 5, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 6, стовпець 6, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 6, стовпець 7, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 6, стовпець 8, закрито"></button>
            
            <button type="button" class="tnkb-cell" aria-label="Рядок 7, стовпець 1, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 7, стовпець 2, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 7, стовпець 3, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 7, стовпець 4, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 7, стовпець 5, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 7, стовпець 6, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 7, стовпець 7, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 7, стовпець 8, закрито"></button>
            
            <button type="button" class="tnkb-cell" aria-label="Рядок 8, стовпець 1, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 8, стовпець 2, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 8, стовпець 3, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 8, стовпець 4, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 8, стовпець 5, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 8, стовпець 6, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 8, стовпець 7, закрито"></button><button type="button" class="tnkb-cell" aria-label="Рядок 8, стовпець 8, закрито"></button>
        </section>
    </main>
</body>
</html>
