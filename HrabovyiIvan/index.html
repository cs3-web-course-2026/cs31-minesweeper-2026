<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper-Hrabovyi Ivan</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- ==================== Game header ==================== -->
    <header class="game-header">
      <!-- Flag counter -->
      <div
        class="counter"
        id="flag-counter"
        role="status"
        aria-live="polite"
        aria-label="Залишилось прапорців"
      >
        <span class="counter-icon" aria-hidden="true">🚩</span>
        <span class="counter-value">000</span>
      </div>

      <!-- Start / restart button -->
      <button
        class="start-btn"
        id="start-btn"
        type="button"
        aria-label="Нова гра"
      >
        <span aria-hidden="true">⏯</span>
      </button>

      <!-- Timer -->
      <div class="counter" id="timer" role="timer" aria-label="Час гри">
        <span class="counter-icon" aria-hidden="true">⏱</span>
        <span class="counter-value">000</span>
      </div>
    </header>

    <main class="game">
      <h1 class="visually-hidden">Сапер</h1>

      <!-- Board cells are created dynamically by script.js -->
      <div class="board" id="board" role="group" aria-label="Ігрове поле"></div>

      <p
        class="game-message"
        id="game-message"
        role="status"
        aria-live="polite"
      ></p>
    </main>
  </body>
</html>
