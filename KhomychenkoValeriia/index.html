<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапер (Minesweeper)</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>

<body>

    <main class="game-wrapper">
        <div class="minesweeper-card">

            <!-- Хедер гри -->
            <header class="game-header">
                <div class="digital-display" title="Залишок мін / прапорців">
                    <span id="mines-display" class="digital-digits">015</span>
                </div>

                <button id="reset-btn" class="reset-btn" type="button" aria-label="Почати нову гру">
                    <span id="face-icon" class="face-icon">🙂</span>
                </button>

                <div class="digital-display" title="Час гри">
                    <span id="timer-display" class="digital-digits">000</span>
                </div>
            </header>

            <!-- Ігрове поле генерується динамічно через script.js -->
            <section id="board" class="board" aria-label="Ігрове поле Сапер"></section>

            <!-- Підвал для статусних сповіщень -->
            <footer class="game-footer">
                <span id="status-tip" class="status-tip">Клікніть будь-яку клітинку для початку гри</span>
            </footer>

        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
