<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сапер</title>
    <link rel="stylesheet" href="./styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <div class="game-container">
      <div class="inner-border">
        <header>
          <div class="game-menu">
            <div
              class="mines-counter-container"
              role="status"
              aria-live="polite"
            >
              010
            </div>
            <div class="start-game-button-container">
              <button type="button" aria-label="Начать игру заново">
                <img
                  src="./assets/images/smile_default.png"
                  alt="Restart game"
                />
              </button>
            </div>
            <div class="timer-container">000</div>
          </div>
        </header>

        <main>
          <p
            id="game-message"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></p>
          <div class="game-board"></div>
        </main>
      </div>
    </div>
  </body>
</html>
