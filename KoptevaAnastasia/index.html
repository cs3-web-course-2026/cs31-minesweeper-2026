<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper-Kopteva Anastasia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game">
    <header class="game-header">
      <div class="counter counter-flags" title="Number of flags" role="status" aria-live="polite">
        <span class="counter-icon" aria-hidden="true">🏳️</span>
        <span class="counter-value" id="flags-count">0</span>
      </div>

      <button class="restart-btn" id="restart-btn" type="button" aria-label="New game">
        <span class="restart-btn-face">START</span>
      </button>

      <div class="counter counter-timer" title="Game time" role="status" aria-live="polite">
        <span class="counter-value" id="timer">00:00</span>
      </div>
    </header>

    <section class="board" id="board" aria-label="Minesweeper board"></section>

    <p class="game-message" id="game-message" role="status" aria-live="polite"></p>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
