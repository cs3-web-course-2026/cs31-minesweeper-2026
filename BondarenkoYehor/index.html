<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sheet">
      <header>
        <h1>Minesweeper<span id="field-info"></span></h1>
        <div class="controls">
          <span class="badge" id="timer"></span>
          <span class="badge" id="flags-counter"></span>
          <button type="button" id="theme-toggle" class="icon-button"></button>
          <button type="button" id="restart">Restart</button>
        </div>
      </header>
      <main>
        <div class="board" id="board"></div>
        <p id="game-message" role="status" aria-live="polite" hidden></p>
        <p class="hint"><kbd>Left click</kbd> dig <span>·</span> <kbd>Right click</kbd> flag</p>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
