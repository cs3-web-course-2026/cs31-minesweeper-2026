<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper — Гаврась Павло</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="game-container">
      <header class="game-header">
        <div
          class="counter"
          id="flag-counter"
          role="status"
          aria-label="Залишилось прапорців"
        >
          <span class="counter-icon" aria-hidden="true">🚩</span>
          <span class="counter-value" id="flag-count">015</span>
        </div>

        <button
          class="restart-button"
          id="restart-btn"
          type="button"
          aria-label="Почати нову гру"
        >
          <span class="restart-face" id="restart-face" aria-hidden="true"
            >😊</span
          >
        </button>

        <div class="counter" id="timer" role="timer" aria-label="Час гри">
          <span class="counter-icon" aria-hidden="true">⏱</span>
          <span class="counter-value" id="timer-count">000</span>
        </div>
      </header>

      <main class="game-main">
        <h1 class="visually-hidden">Сапер (Minesweeper)</h1>

        <!-- Ігрове поле генерується динамічно через script.js -->
        <div
          class="board"
          id="board"
          role="group"
          aria-label="Ігрове поле"
        ></div>

        <p
          class="game-message"
          id="game-message"
          role="status"
          aria-live="polite"
        ></p>
      </main>
    </div>
  </body>
</html>
