<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сапер</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="game-header">
      <p class="game-eyebrow">Класична головоломка</p>
      <h1>Сапер</h1>

      <div class="game-controls">
        <div class="indicator">
          <span class="indicator-icon" aria-hidden="true">🚩</span>
          <span class="indicator-value" id="flag-counter" aria-live="polite">010</span>
          <span class="indicator-label">Прапорці</span>
        </div>

        <button class="restart-button" type="button" aria-label="Почати нову гру">
          <span id="restart-face" aria-hidden="true">🙂</span>
          <span class="restart-button-text">Нова гра</span>
        </button>

        <div class="indicator">
          <span class="indicator-icon" aria-hidden="true">⏱</span>
          <span class="indicator-value" id="timer">000</span>
          <span class="indicator-label">Час</span>
        </div>
      </div>
    </header>

    <section class="board-section" aria-label="Ігрове поле Сапера">
      <p class="board-section-hint">
        Лівий клік — відкрити. Правий клік або F — прапорець.
      </p>

      <div class="board" id="board"></div>

      <p class="game-message" id="game-message" role="status" aria-live="polite">
        Відкрийте клітинку, щоб почати гру.
      </p>
    </section>
  </main>
</body>
</html>
