<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <section class="game-card">
      <header class="game-header">
        <!-- таймер та кнопка нової гри -->
        <div class="status-panel status-panel-time" aria-label="Timer: 000">
          <span class="status-label">Timer</span>
          <span id="timer" class="status-value">000</span>
        </div>

        <!-- індикатори результату гри -->
        <div id="loss-indicator" class="result-indicator" role="status" aria-label="Loss">LOSS</div>

        <button id="restart-button" class="start-button" type="button" aria-label="Start new game">
          <img id="game-face" class="face" src="assets/verity.png" alt="">
        </button>

        <div id="win-indicator" class="result-indicator" role="status" aria-label="Win">WIN</div>

        <!-- міни  -->
        <div class="status-panel status-panel-mines" aria-label="Mines: 015">
          <span class="status-label">Mines</span>
          <span id="flags-counter" class="status-value">015</span>
        </div>
      </header>

      <h1 id="game-title" class="game-title">Minesweeper</h1>

      <!-- ігрове поле створюється з даних у script.js -->
      <div id="board" class="board" role="grid" aria-labelledby="game-title"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
