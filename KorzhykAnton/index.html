<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper — Коржик Антон</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <h1 class="game-title">Minesweeper</h1>

    <header class="game-header">
      <div class="counter" role="status" aria-live="polite" aria-label="Залишилось прапорців">
        <span class="counter-icon" aria-hidden="true">🚩</span>
        <span id="flags-counter">000</span>
      </div>

      <button class="restart-button" id="restart-button" type="button" aria-label="Нова гра">🙂</button>

      <div class="counter" aria-label="Час гри, секунд">
        <span class="counter-icon" aria-hidden="true">⏱</span>
        <time id="timer" datetime="PT0S">000</time>
      </div>
    </header>

    <section class="board" id="board" aria-label="Ігрове поле"></section>

    <p class="game-status" id="game-status" role="status" aria-live="polite"></p>
    <p class="game-hint">Лівий клік — відкрити клітинку. Правий клік або клавіша F — поставити чи зняти прапорець.</p>
  </main>
</body>
</html>
