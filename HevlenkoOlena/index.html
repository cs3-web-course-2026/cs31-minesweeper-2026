<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper — Гевленко Олена</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="minesweeper-app">
      <div class="frame-inset">
        <header class="status-bar">
          <div
            class="lcd-display"
            id="flag-counter"
            role="status"
            aria-live="polite"
            aria-label="Залишилось прапорців"
          >
            <span class="lcd-icon" aria-hidden="true">🚩</span>
            <span class="lcd-digits" id="flags-value">015</span>
          </div>

          <button
            type="button"
            class="face-btn"
            id="restart-btn"
            aria-label="Почати нову гру"
          >
            🙂
          </button>

          <div
            class="lcd-display"
            id="game-timer"
            aria-label="Час гри у секундах"
          >
            <span class="lcd-icon" aria-hidden="true">⏱️</span>
            <span class="lcd-digits" id="timer-value">000</span>
          </div>
        </header>

        <div
          class="game-message"
          id="game-message"
          role="status"
          aria-live="polite"
        ></div>

        <section
          class="grid-field"
          id="board"
          aria-label="Ігрове поле Сапер"
        ></section>
      </div>
    </main>
  </body>
</html>
