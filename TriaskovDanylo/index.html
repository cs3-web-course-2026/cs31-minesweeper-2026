<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сапер</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <h1 class="visually-hidden">Сапер</h1>

      <header class="game-header">
        <p class="indicator">
          <span class="indicator-label">Час</span>
          <time class="indicator-value" id="timer" datetime="PT0S">000</time>
        </p>

        <button class="start-button" id="start-button" type="button">
          Старт
        </button>

        <p class="indicator indicator-flags">
          <span class="indicator-label">Прапорці</span>
          <span class="indicator-value" id="flag-counter">015</span>
        </p>
      </header>

      <section
        class="board"
        id="board"
        aria-label="Ігрове поле"
      ></section>

      <p
        class="game-message"
        id="game-message"
        role="status"
        aria-live="polite"
      ></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
