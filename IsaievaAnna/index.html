<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<main class="game">
    <header class="game-header">
        <h1 class="game-title">Minesweeper</h1>

        <div class="game-status">
            <p class="status-item"
               role="status"
               aria-live="polite"
               aria-label="Кількість прапорців">
                ⚑ <span class="flags-value">10</span>
            </p>

            <button class="restart-button" type="button" aria-label="Почати нову гру">
                ↻
            </button>

            <p class="status-item" aria-label="Таймер гри">
                ⏱ <span class="timer-value">000</span>
            </p>
        </div>
    </header>

    <div class="game-board" aria-label="Ігрове поле Minesweeper"></div>

    <p class="game-hint">
        ЛКМ - відкрити клітинку,  ПКМ - встановити або зняти прапорець
    </p>

    <p class="game-message" role="status" aria-live="polite"></p>
</main>

<script src="script.js" defer></script>
</body>
</html>
