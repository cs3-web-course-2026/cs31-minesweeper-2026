<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Гра Сапер — лабораторна робота №2">
    <title>Minesweeper — Лабораторна робота №2</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="game-container">
        <header class="game-header">
            <p class="game-subtitle">Класична гра</p>
            <h1 class="game-title">Сапер</h1>
            <p class="game-description">
                Знайди всі безпечні клітинки та не натрап на міни!
            </p>
        </header>

        <section class="game-panel" aria-label="Ігрова панель">
            <div class="game-stats">
                <div class="stat">
                    <span class="stat-label">Час</span>
                    <strong class="stat-value" id="timer">00:00</strong>
                </div>

                <div class="stat">
                    <span class="stat-label">Прапорці</span>
                    <strong
                        class="stat-value"
                        id="flags"
                        aria-live="polite"
                    >15</strong>
                </div>
            </div>

            <p class="game-message" id="message" role="status" aria-live="polite">
                Зроби перший хід.
            </p>

            <div
                class="board"
                id="board"
                role="grid"
                aria-label="Ігрове поле Сапер, 10 рядків і 10 стовпців"
            ></div>

            <button class="new-game-button" id="new-game" type="button">
                Нова гра
            </button>
        </section>

        <footer class="game-footer">
            <p>Ліва кнопка миші — відкрити клітинку</p>
            <p>Права кнопка миші — встановити або зняти прапорець</p>
        </footer>
    </main>
</body>
</html>
