<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Share+Tech+Mono&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <div class="inner-border">
        <header class="panel">
          <div
            class="counter"
            id="mines-counter"
            role="status"
            aria-live="polite"
          >
            <span class="visually-hidden">Залишилось прапорців:</span>
            <span class="counter-icon" aria-hidden="true"></span>
            <span class="counter-value">010</span>
          </div>

          <button
            type="button"
            class="restart-btn"
            id="restart-btn"
            aria-label="Нова гра"
          ></button>

          <div class="counter" id="timer" role="timer" aria-label="Час гри">
            <span class="counter-icon" aria-hidden="true"></span>
            <span class="counter-value">00:00</span>
          </div>
        </header>

        <div
          class="board"
          id="board"
          role="group"
          aria-label="Ігрове поле"
        ></div>
      </div>
      <p
        class="visually-hidden"
        id="game-message"
        role="status"
        aria-live="polite"
      ></p>
    </main>
  </body>
</html>
