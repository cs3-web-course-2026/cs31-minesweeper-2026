name: Lint

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine changed files
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED_JS=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.js')
          CHANGED_CSS=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.css')

          {
            echo "js<<EOF"
            echo "$CHANGED_JS"
            echo "EOF"
            echo "css<<EOF"
            echo "$CHANGED_CSS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run ESLint on changed JS files
        if: steps.changed.outputs.js != ''
        run: echo "${{ steps.changed.outputs.js }}" | xargs npx eslint

      - name: Run Stylelint on changed CSS files
        if: steps.changed.outputs.css != ''
        run: echo "${{ steps.changed.outputs.css }}" | xargs npx stylelint
